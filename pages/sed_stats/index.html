<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sed/Stats</title>
<link rel="icon" type="image/png" href="assets/sed_stats.png">
<link rel="apple-touch-icon" href="assets/sed_stats.png">
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
<meta name="description" content="Sed/Stats is a web app that facilitates visualization and interpretation of sedimentological dataUpload your data and generate high-quality, publication-ready figures in just a few clicks.">
  <meta name="keywords" content="sedimentology, geology, detrital zircon, python, mixture modeling, microplastics">
  <meta name="author" content="Ryan Nielsen">
  <meta property="og:title" content="Sed/Stats">
  <meta property="og:description" content="Build publication-ready figures in just a few clicks">
  <meta property="og:url" content="https://sedstats.com">
  
  <style>@keyframes spin {
      0% {
          transform: rotate(0deg);
      }
      100% {
          transform: rotate(360deg);
      }
  }</style>
  <style>@keyframes fadeInDown {
      0% {
          opacity: 0;
          transform: translateY(-30px);
      }
      100% {
          opacity: 1;
          transform: translateY(0px);
      }
  }</style>
  <style>@keyframes fadeInUp {
      0% {
          opacity: 0;
          transform: translateY(30px);
      }
      100% {
          opacity: 1;
          transform: translateY(0px);
      }
  }</style>
</head>
<body>
<div style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif; background: linear-gradient(135deg, #305a88 0%, #99b1cb 30%, #ccc3ba 35%, #b2a48a 41%, #9c8969 47%, #9e6549 53%, #8e5b42 59%, #665141 65%, #99b1cb 70%, #305a88 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: white">
    <div id="loading-splash" style="text-align: center; padding: 40px; max-width: 600px">
      <div style="font-size: 4em; font-weight: bold; margin-bottom: 20px; background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text">Sed/Stats</div>
      <p style="font-size: 1.5em; margin-bottom: 30px; opacity: 0.9; animation: fadeInUp 0.8s ease-out 0.2s both">Visualize and Interpret Sedimentological Data</p>
      <div style="margin: 30px auto 20px auto; animation: fadeInUp 0.8s ease-out 0.6s both">
        <div style="border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid white; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 0 auto"></div>
      </div>
      <p style="font-size: 1.1em; margin: 0; opacity: 0.8">Loading modules...</p>
    </div>
  </div>
<script>
async function initializeApp() {
    try {
        // Cache-busting timestamp - prevents browser from serving stale files
        const cacheBuster = 1789669472946;

        // Initialize Pyodide
        const pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/" });

        // Load Pyodide packages first
        const pyodidePackages = ['micropip'];
        console.log('Loading Pyodide packages:', pyodidePackages);
        await pyodide.loadPackage(pyodidePackages);

        const pythonFiles = ['scripts/splash.py', 'scripts/main.py', 'scripts/plot_lib/export.py', 'scripts/plot_lib/chart.py', 'scripts/plot_lib/__init__.py', 'scripts/plot_lib/traces.py', 'scripts/sed_stats/pca.py', 'scripts/sed_stats/grains.py', 'scripts/sed_stats/smacof.py', 'scripts/sed_stats/metrics_2d.py', 'scripts/sed_stats/mds.py', 'scripts/sed_stats/ternary.py', 'scripts/sed_stats/__init__.py', 'scripts/sed_stats/metrics.py', 'scripts/sed_stats/mixture.py', 'scripts/sed_stats/distributions/categorical.py', 'scripts/sed_stats/distributions/histogram.py', 'scripts/sed_stats/distributions/bivariate.py', 'scripts/sed_stats/distributions/numeric.py', 'scripts/drive_lib/files.py', 'scripts/drive_lib/__init__.py', 'scripts/drive_lib/gis.py', 'scripts/spreadsheet_lib/grid.py', 'scripts/spreadsheet_lib/upload.py', 'scripts/spreadsheet_lib/__init__.py', 'scripts/spreadsheet_lib/importers.py', 'scripts/ui_lib/overlay.py', 'scripts/ui_lib/tabs.py', 'scripts/ui_lib/ribbon.py', 'scripts/ui_lib/wizard.py', 'scripts/ui_lib/__init__.py', 'scripts/ui_lib/fields.py', 'scripts/ui_lib/toolbar.py', 'scripts/dashboard/tables.py', 'scripts/dashboard/shell.py', 'scripts/dashboard/bivariate_matrix.py', 'scripts/dashboard/plots.py', 'scripts/dashboard/example_data.py', 'scripts/dashboard/errors.py', 'scripts/dashboard/bivariate_mixture.py', 'scripts/dashboard/bivariate_mds.py', 'scripts/dashboard/matrices.py', 'scripts/dashboard/tools.py', 'scripts/dashboard/mds_plot.py', 'scripts/dashboard/bivariate.py', 'scripts/dashboard/gallery.py', 'scripts/dashboard/ternary_plot.py', 'scripts/dashboard/save_dialog.py', 'scripts/dashboard/drive.py', 'scripts/dashboard/config.py', 'scripts/dashboard/__init__.py', 'scripts/dashboard/mixture.py', 'scripts/dashboard/dataset.py', 'scripts/dashboard/bivariate_plot.py', 'scripts/dashboard/pca_axes.py', 'scripts/dashboard/distributions.py', 'scripts/dashboard/scatter.py', 'scripts/component_lib/display.py', 'scripts/component_lib/typography.py', 'scripts/component_lib/navigation.py', 'scripts/component_lib/input.py', 'scripts/component_lib/button.py', 'scripts/component_lib/utils.py', 'scripts/component_lib/feedback.py', 'scripts/component_lib/__init__.py', 'scripts/component_lib/layout.py', 'scripts/gis_lib/layers.py', 'scripts/gis_lib/raster.py', 'scripts/gis_lib/standalone_map.py', 'scripts/gis_lib/demo.py', 'scripts/gis_lib/__init__.py', 'scripts/gis_lib/features.py', 'scripts/gis_lib/styles.py'];
        const assetFiles = ['assets/sed_stats.png', 'assets/styles.css'];
        const antiochFiles = ['antioch/elements.py', 'antioch/static.py', 'antioch/dom.py', 'antioch/event_registry.py', 'antioch/events.py', 'antioch/__init__.py', 'antioch/event.py', 'antioch/themes/rhyolite.py', 'antioch/themes/quartzite.py', 'antioch/themes/marble.py', 'antioch/themes/theme_manager.py', 'antioch/themes/basalt.py', 'antioch/themes/__init__.py', 'antioch/themes/jasper.py', 'antioch/themes/diorite.py', 'antioch/core/themed.py', 'antioch/core/filesystem.py', 'antioch/core/storage.py', 'antioch/core/__init__.py', 'antioch/core/async_storage.py', 'antioch/core/sync_queue.py', 'antioch/macros/storage_settings.py', 'antioch/macros/base.py', 'antioch/macros/window.py', 'antioch/macros/progressbar.py', 'antioch/macros/code_block.py', 'antioch/macros/datatable.py', 'antioch/macros/form.py', 'antioch/macros/download_link.py', 'antioch/macros/tabs.py', 'antioch/macros/webcanvas.py', 'antioch/macros/chartjs.py', 'antioch/macros/accordion.py', 'antioch/macros/js_library.py', 'antioch/macros/file_upload.py', 'antioch/macros/containers.py', 'antioch/macros/toast.py', 'antioch/macros/__init__.py', 'antioch/macros/js_library_example.py', 'antioch/macros/dropdown.py', 'antioch/macros/map.py', 'antioch/macros/sync_status.py', 'antioch/macros/google_map.py', 'antioch/macros/file_select.py', 'antioch/macros/modal.py', 'antioch/macros/pagination.py', 'antioch/macros/slider.py', 'antioch/macros/toolbar.py', 'antioch/macros/window_manager.py', 'antioch/macros/counter.py', 'antioch/macros/alert.py', 'antioch/macros/canvas_macros/base.py', 'antioch/macros/canvas_macros/button.py', 'antioch/macros/canvas_macros/__init__.py', 'antioch/lib/loader.py', 'antioch/lib/__init__.py'];
        const extraDirs = [];
        const localPkgs = [];
        const pypiPkgs = ['numpy', 'openpyxl', 'xlrd'];

        // --- Create directories in Pyodide FS ---
        console.log('Creating directories in Pyodide filesystem...');

        // Helper function to create directories recursively
        function createDirectoryRecursive(path) {
            const parts = path.split('/').filter(p => p);
            let currentPath = '';
            for (const part of parts) {
                currentPath += '/' + part;
                try {
                    pyodide.FS.mkdir(currentPath);
                    console.log(`Created directory: ${currentPath}`);
                } catch (e) {
                    // Directory already exists, ignore
                }
            }
        }

        // Create base directories
        createDirectoryRecursive("/antioch");
        createDirectoryRecursive("/antioch/macros");
        createDirectoryRecursive("/scripts");
        createDirectoryRecursive("/assets");

        // Create all needed directories from Python files
        const allFiles = [...pythonFiles, ...antiochFiles, ...assetFiles];
        for (const file of allFiles) {
            const dirPath = file.substring(0, file.lastIndexOf('/'));
            if (dirPath && !dirPath.includes('..')) {
                createDirectoryRecursive('/' + dirPath);
            }
        }

        // Create additional directories
        for(const d of extraDirs){
            try{
                pyodide.FS.mkdir(d);
                console.log(`Created directory: ${d}`);
            }catch(e){
                console.warn(`Directory ${d} already exists or could not be created`);
            }
        }

        // --- Load files into FS ---
        const sourceBundle = 'python_sources.json';

        // Fetch concurrently. One `await` per file means one network round
        // trip per file, in series — invisible on localhost, and seconds of
        // dead time on any connection with real latency.
        const FETCH_CONCURRENCY = 12;

        async function loadFiles(list, label){
            let loaded = 0;
            for(let start = 0; start < list.length; start += FETCH_CONCURRENCY){
                const batch = list.slice(start, start + FETCH_CONCURRENCY);
                const fetched = await Promise.all(batch.map(async (f) => {
                    try {
                        const response = await fetch(f + '?v=' + cacheBuster);
                        if(!response.ok) throw new Error('HTTP ' + response.status);
                        return [f, await response.text()];
                    } catch(e){
                        console.warn(`✗ Failed to load ${f}:`, e);
                        return null;
                    }
                }));
                // Written in list order even though they arrived in any order.
                for(const entry of fetched){
                    if(!entry) continue;
                    pyodide.FS.writeFile("/"+entry[0], entry[1]);
                    loaded++;
                }
            }
            console.log(`✓ Loaded ${loaded}/${list.length} ${label} files`);
        }

        // One request for every Python source, rather than one per file.
        async function loadSourceBundle(){
            if(!sourceBundle) return null;
            try {
                const response = await fetch(sourceBundle + '?v=' + cacheBuster);
                if(!response.ok) throw new Error('HTTP ' + response.status);
                return await response.json();
            } catch(e){
                console.warn('Source bundle unavailable, fetching files individually:', e);
                return null;
            }
        }

        // Load all Python files
        const bundledSources = await loadSourceBundle();
        if(bundledSources){
            let written = 0;
            for(const [path, content] of Object.entries(bundledSources)){
                try {
                    pyodide.FS.writeFile("/"+path, content);
                    written++;
                } catch(e){
                    console.warn(`✗ Failed to write ${path}:`, e);
                }
            }
            console.log(`✓ Loaded ${written} Python files from ${sourceBundle}`);
        } else {
            await loadFiles(antiochFiles, 'antioch');
            await loadFiles(pythonFiles, 'scripts');
        }
        await loadFiles(assetFiles, 'assets');

        // --- Setup Python path ---
        console.log('Setting up Python path...');
        let pythonPathSetup = `
import sys
# Add core directories to Python path
sys.path.insert(0, '/')
sys.path.insert(0, '/antioch')
sys.path.insert(0, '/antioch/macros')
sys.path.insert(0, '/antioch/macros/canvas_macros')
sys.path.insert(0, '/scripts')`;

        // Add additional directories to Python path
        for(const d of extraDirs){
            pythonPathSetup += `\nsys.path.insert(0, '${d}')`;
        }

        pythonPathSetup += `\nprint('Python path updated with:', sys.path[:8])`;
        await pyodide.runPython(pythonPathSetup);

        // --- Install local packages ---
        if(localPkgs.length > 0) {
            console.log('Installing local packages:', localPkgs);
            for(const pkg of localPkgs){
                try {
                    await pyodide.runPythonAsync(`import micropip; await micropip.install("${pkg}")`);
                    console.log(`✓ Installed local package: ${pkg}`);
                } catch(e) {
                    console.warn(`✗ Failed to install local package ${pkg}:`, e);
                }
            }
        }

        // --- Install PyPI packages ---
        if(pypiPkgs.length > 0) {
            console.log('Installing PyPI packages:', pypiPkgs);
            for(const pkg of pypiPkgs){
                try {
                    await pyodide.runPythonAsync(`import micropip; await micropip.install("${pkg}")`);
                    console.log(`✓ Installed PyPI package: ${pkg}`);
                } catch(e) {
                    console.warn(`✗ Failed to install PyPI package ${pkg}:`, e);
                }
            }
        }

        // --- Execute main.py if exists ---
        let mainScript = pythonFiles.includes('scripts/main.py')
                        ? 'scripts/main.py'
                        : (pythonFiles.includes('main.py') ? 'main.py' : null);

        if(mainScript){
            console.log(`Executing main script: ${mainScript}`);
            const code = await fetch(mainScript + '?v=' + cacheBuster).then(r=>r.text());
            await pyodide.runPythonAsync(code);
            console.log(`✓ Executed ${mainScript}`);
        } else {
            console.log('No main.py found, skipping execution');
        }

        // Hide loading and show content (if elements still exist)
        const loadingEl = document.getElementById("loading");
        const contentEl = document.getElementById("content");

        if (loadingEl) {
            loadingEl.style.display = "none";
        }
        if (contentEl) {
            contentEl.style.display = "block";
        }
        console.log('🎉 Application loaded successfully!');

    } catch(err) {
        console.error('💥 Error loading application:', err);
        const loadingEl = document.getElementById("loading");
        if (loadingEl) {
            loadingEl.innerHTML =
                `<div style="color:red; padding:20px;">
                    <h3>Error loading application</h3>
                    <p>${err.message}</p>
                    <details><summary>Stack trace</summary><pre>${err.stack}</pre></details>
                </div>`;
        } else {
            // If loading element doesn't exist, create error display in body
            const errorDiv = document.createElement('div');
            errorDiv.innerHTML =
                `<div style="color:red; padding:20px;">
                    <h3>Error loading application</h3>
                    <p>${err.message}</p>
                    <details><summary>Stack trace</summary><pre>${err.stack}</pre></details>
                </div>`;
            document.body.appendChild(errorDiv);
        }
    }
}

// Start loading when page is ready
window.addEventListener("DOMContentLoaded", initializeApp);
</script>
</body>
</html>
